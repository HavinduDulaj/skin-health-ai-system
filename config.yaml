# Default pipeline settings. Override via CLI flags or environment variables.

dataset_root: data/raw/Skin_Risk_Dataset_V5_Synthetic
output_root: pipeline_output

seed: 42

splits:
  - train
  - val
  - test

lesion_types:
  - acne
  - burns
  - rash
  - warts

risk_levels:
  - Low
  - Medium
  - High

valid_extensions:
  - .jpg
  - .jpeg
  - .png
  - .bmp
  - .webp
  - .tif
  - .tiff

# Validation / quality
min_width: 64
min_height: 64
min_file_bytes: 128
unusual_aspect_ratio: 4.0

# Exact duplicate: file SHA-256 and decoded-pixel SHA-256
# Near-duplicate: perceptual hashes
phash_size: 8
phash_threshold: 8          # Hamming distance; 8 is a common near-dup cutoff for 64-bit pHash
dhash_threshold: 8
exact_near_threshold: 2     # treat as essentially the same image; keep one

# Quality flags (borderline images go to Review/, they are not auto-deleted)
blur_laplacian_threshold: 40.0
overexposure_ratio: 0.80
underexposure_ratio: 0.80
low_contrast_std: 10.0
low_entropy: 3.0

# Label-consistency (within the same lesion type only)
label_phash_threshold: 8
medium_priority_threshold: 10

# Rebuild
train_ratio: 0.70
val_ratio: 0.15
test_ratio: 0.15
# Conservative rebuild excludes CHECK_LABEL / CHECK_QUALITY / REVIEW
# unless the user edits review.csv to KEEP.
exclude_unreviewed_flags: false
exclude_synthetic: true
# Keep one image for exact duplicates and near-duplicates with Hamming <= exact_near_threshold.
# Other same-label near-duplicates stay in the same split.
keep_same_label_near_duplicates: true

final_dataset_name: Skin_Risk_Dataset_V4
